name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Schema, RLS and retention
    runs-on: ubuntu-latest

    # The Phase 0 acceptance criteria, run against a real Postgres with pgvector
    # rather than a mock. RLS that is only asserted in unit tests is RLS nobody
    # has actually tested.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Acceptance tests
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./supabase/tests/run.sh

  ml:
    name: ML core and eval harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Without the model extras on purpose. The quality gate, the embedding
      # arithmetic, the threshold provenance checks and the whole eval harness
      # run on numpy, so CI does not download 300MB of ONNX weights to find out
      # whether the tier table is right.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check faceapp_ml eval tests

      - name: Tests
        run: pytest -q

      - name: Harness self-check
        run: python -m eval.run --synthetic --out /tmp/eval-reports

      - name: Thresholds must still be untuned, or tuned with valid provenance
        # Guards the rule that makes the rest of it worth anything: a threshold
        # in the repo has to be traceable to the report that produced it. A
        # hand-edited number fails the digest check here rather than in
        # production.
        run: |
          python - <<'PY'
          from faceapp_ml.config import (
              UntunedThresholdError,
              ThresholdProvenanceError,
              load_thresholds,
          )
          try:
              t = load_thresholds()
          except UntunedThresholdError:
              print("thresholds are untuned; the search path will refuse to run. Expected for now.")
          except ThresholdProvenanceError as exc:
              raise SystemExit(f"thresholds present but not traceable to an eval report:\n{exc}")
          else:
              p = t.provenance
              print(f"T_high={t.t_high} T_low={t.t_low} from {p.report} ({p.dataset_id})")
          PY

  web:
    name: Web app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
